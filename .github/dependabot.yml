version: 2
updates:
  # Keeps npm dependencies current. PRs from Dependabot are auto-merged by
  # .github/workflows/dependabot-auto-merge.yml once the test workflows pass.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for all non-major bumps keeps the auto-merge queue short.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
